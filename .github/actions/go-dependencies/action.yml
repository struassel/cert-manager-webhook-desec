name: 'Retrieve Go dependencies'
description: 'Retrieve Go dependencies and submit using GitHub submission API'

inputs:
  mod:
    description: 'go.mod file'
    required: false
    default: "go.mod"
  target:
    description: 'Build target'
    required: false
    default: 'main.go'
runs:
  using: "composite"
  steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ">=1.25.1"

    - name: Run snapshot action
      uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2
      env:
        GOPROXY: ''
        GOPRIVATE: ''
      with:
          # Required: Define the repo path to the go.mod file used by the
          # build target
          go-mod-path: ${{ inputs.mod }}
          #
          # Optional. Define the repo path of a build target,
          # a file with a `main()` function.
          # If undefined, this action will collect all dependencies
          # used by all build targets for the module. This may
          # include Go dependencies used by tests and tooling.
          go-build-target: ${{ inputs.target }}