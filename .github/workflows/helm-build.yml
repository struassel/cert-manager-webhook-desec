name: Helm Build

on:
  push:
    branches:
    - '**'
    paths:
    - 'charts/**'
  pull_request:
    branches:
    - '**'
    paths:
    - 'desec/**'
    - 'go.*'
    - '*.go'
    - 'Dockerfile'
  workflow_dispatch:


jobs:
  build-chart:
    name: Build chart
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v3.21.4 # Specify a specific Helm version

    - name: Helm linter
      run: |
        helm lint charts/**

    - name: Build helm package
      run: |
        helm package charts/**
